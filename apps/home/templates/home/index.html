
{% if user.is_authenticated %}
    <div>
        Email: {{ user.email }}
    </div>
    <div><a href="{% url 'account_logout' %}">Sign Out</a></div>
{% else %}
    <div><a href="{% url 'account_login' %}">Login</a></div>
    <div><a href="/accounts/saml/mock-saml/login/">Login with SSO</a></div>
{% endif %}
